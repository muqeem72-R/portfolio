<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Python Quest | Learn Python by Playing</title>
  <meta name="description" content="Python Quest is a free game that teaches Python step by step. Choose, fill and arrange code on 8 islands. No typing and no sign-up. Works on phone, tablet and laptop.">
  <meta name="author" content="Mukeem Khan">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b1020">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Python Quest | Learn Python by Playing">
  <meta property="og:description" content="40 short challenges on 8 islands. Choose, fill and arrange code to learn Python. Free, no typing, no sign-up.">
  <meta property="og:image" content="https://mukeemkhan.pages.dev/games_on_my_web/python-quest/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Python Quest, a game to learn Python by choosing, filling and arranging code.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip" href="#app">Skip to the game</a>

  <header class="top">
    <div class="top-in">
      <a class="brand" href="#/" aria-label="Python Quest home">
        <img src="favicon.svg" alt="" width="32" height="32">
        <span class="brand-text">Python Quest</span>
      </a>
      <div class="stats" aria-label="Your progress">
        <span class="chip" id="stat-xp" title="Experience points"><span aria-hidden="true">⭐</span> <span id="xp-val">0</span> XP</span>
        <span class="chip" id="stat-streak" title="Days in a row you played"><span aria-hidden="true">🔥</span> <span id="streak-val">0</span><span class="chip-label"> day streak</span></span>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme"><span id="theme-icon" aria-hidden="true">🌙</span></button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="notice">Python Quest needs JavaScript. Please turn it on in your browser and reload this page.</p></noscript>
  </main>

  <footer class="foot">
    <p>Made by <a href="https://mukeemkhan.pages.dev/">Mukeem Khan</a>. Free to play. Your progress is saved only in this browser.</p>
  </footer>

  <script src="js/levels.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
