<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MK monogram">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <g transform="translate(32 32.5) rotate(45) scale(1.12) translate(-32 -32.5)">
    <!-- M, upright before the turn: left leg and right leg -->
    <path d="M19 52V13 M45 52V13" fill="none" stroke="#ffffff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- K, on its side before the turn: its arms are the V of the M, its stem is the bar through the tip of the V -->
    <path d="M19 13L32 36L45 13 M7 36H57" fill="none" stroke="#fde68a" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
